name: attendance
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^10.1.0
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  get: ^4.6.5
  flutter_svg: ^2.0.7
  fluttertoast: ^8.2.4
  get_storage: ^2.1.1
  dio: ^5.3.3
  cached_network_image: ^3.2.3
  flutter_dotenv: ^5.1.0
  image_picker: ^1.0.4

  table_calendar: ^3.1.2
  local_auth: ^2.1.7
  camera: ^0.10.5+9
  permission_handler: ^11.0.1
  flutter_screenutil: ^5.9.0
  path_provider: ^2.1.0
  path: ^1.9.1
  image: ^4.0.17
  animated_bottom_navigation_bar: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - asset/image/svg_image/
    - asset/image/png_images/
    - asset/dummyMettings.json
    - asset/dummyHolidays.json
    - asset/dummyLeaveTypes.json
    - asset/.env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "asset/image/png_images/ic_launcher.png"
  adaptive_icon_background: "#0C335E"
  min_sdk_android: 21
  remove_alpha_ios: true

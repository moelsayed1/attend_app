name: attendance
description: "Nassar Attendance"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^10.1.0
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  get: ^4.6.5
  flutter_svg: ^2.0.17
  fluttertoast: ^8.2.4
  get_storage: ^2.1.1
  dio: ^5.3.3
  cached_network_image: ^3.2.3
  flutter_dotenv: ^5.1.0
  image_picker: ^1.0.4

  table_calendar: ^3.1.2
  local_auth: ^2.1.7
  camera: ^0.10.5+9
  permission_handler: ^11.0.1
  flutter_screenutil: ^5.9.0
  path_provider: ^2.1.0
  path: ^1.9.1
  image: ^4.0.17
  animated_bottom_navigation_bar: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0 

flutter:
